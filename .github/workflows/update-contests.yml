name: Update Contest Listings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests beautifulsoup4

      - name: Collect contest listings
        run: python collector/collector.py

      - name: Save updated contests
        run: |
          git config user.name "contest-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contests.json

          if git diff --cached --quiet; then
            echo "No contest data changes."
          else
            git commit -m "Update contest listings"
            git push
          fi
