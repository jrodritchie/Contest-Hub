<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17324d"><link rel="manifest" href="manifest.json"><title>Contest Hub</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#142331;background:#eef3f7}
*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh;background:#eef3f7}
.top{position:sticky;top:0;z-index:5;background:#17324d;color:#fff;padding:18px 16px 14px;box-shadow:0 2px 10px #0003}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{margin:0;font-size:25px}.sub{opacity:.8;font-size:13px;margin-top:3px}
.refresh{background:#ffffff1c;border:1px solid #ffffff44;color:#fff;border-radius:12px;padding:9px 12px}
.filters{padding:10px 12px 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select{width:100%;padding:11px;border:1px solid #ccd6df;border-radius:12px;background:#fff;font:inherit}
.stats{display:flex;gap:8px;padding:8px 12px;overflow:auto}.stat{background:#fff;border-radius:14px;padding:9px 13px;min-width:100px;box-shadow:0 2px 7px #0001}.stat b{display:block;font-size:20px}
.feed{padding:4px 12px 80px}.card{background:#fff;border-radius:17px;margin:9px 0;padding:14px;box-shadow:0 2px 8px #0001}
.cardtop{display:flex;justify-content:space-between;gap:12px}.title{font-weight:750;font-size:16px;line-height:1.25}.prize{font-size:19px;font-weight:800;white-space:nowrap}
.badges{margin-top:7px}.badge{display:inline-block;background:#e7f0f7;border-radius:999px;padding:4px 8px;margin:3px 4px 0 0;font-size:11px}
.meta{font-size:13px;color:#5d6a74;margin-top:8px}.note{font-size:12px;color:#6c7881;margin-top:6px}
.actions{display:flex;gap:7px;margin-top:12px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;border-radius:11px;padding:10px;border:1px solid #ccd6df;background:#fff;font:inherit}
.actions .open{background:#17324d;color:#fff;border-color:#17324d}.actions .entered{background:#e6f5e9;border-color:#9bd0a5}
.status{padding:0 12px 4px;color:#687681;font-size:12px}.empty{text-align:center;padding:40px;color:#687681}
</style></head><body><div class="app">
<header class="top"><div class="topline"><div><h1>🎯 Contest Hub</h1><div class="sub">Your personal Canadian contest dashboard</div></div><button class="refresh" onclick="load()">↻ Refresh</button></div></header>
<div id="status" class="status">Loading latest listings…</div
